version: "3.8"

services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    network_mode: host
    environment:
      - MTX_PROTOCOLS=tcp,udp
      - MTX_WEBRTCADDITIONALHOSTS=192.168.0.0/16
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    # Ports (when not using network_mode: host):
    # ports:
    #   - "8554:8554"   # RTSP
    #   - "1935:1935"   # RTMP
    #   - "8888:8888"   # HLS
    #   - "8889:8889"   # WebRTC
    #   - "8890:8890"   # SRT
    #   - "9997:9997"   # API

  # Optional: FFmpeg transcoder for re-encoding streams
  # ffmpeg:
  #   image: linuxserver/ffmpeg:latest
  #   container_name: ffmpeg-transcoder
  #   restart: unless-stopped
  #   command: >
  #     -rtsp_transport tcp
  #     -i rtsp://192.168.0.203:554/stream
  #     -c:v libx264 -preset ultrafast -tune zerolatency
  #     -c:a aac -b:a 128k
  #     -f rtsp rtsp://mediamtx:8554/camera1
